name: BSF IGMC AgF2 Stage2 geometry-only verification
on:
  pull_request:
    paths:
      - '.github/workflows/bsf-igmc-agf2-stage2.yml'
      - 'papers/xiang-2025-intrinsic-gyrotropic-magnetic-current/research/bsf-igmc/agf2_preflight/stage2_geometry/**'
  push:
    paths:
      - '.github/workflows/bsf-igmc-agf2-stage2.yml'
      - 'papers/xiang-2025-intrinsic-gyrotropic-magnetic-current/research/bsf-igmc/agf2_preflight/stage2_geometry/**'
jobs:
  geometry-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify six unrelaxed POSCARs, source SHA, vacuum and B1-B2 connector
        run: python papers/xiang-2025-intrinsic-gyrotropic-magnetic-current/research/bsf-igmc/agf2_preflight/stage2_geometry/verify_candidates.py
