name: Cui Flux isolated geometry regression
on:
  push:
    paths:
      - 'papers/cui-2026-curvature-flux-zeeman-qgt/**'
      - '.github/workflows/cui-flux-geometry.yml'
  pull_request:
    paths:
      - 'papers/cui-2026-curvature-flux-zeeman-qgt/**'
      - '.github/workflows/cui-flux-geometry.yml'
jobs:
  nondegenerate-method:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: papers/cui-2026-curvature-flux-zeeman-qgt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install independent geometry kernel
        run: python -m pip install -e .
      - name: Verify restricted published subset
        run: python -m unittest discover -s tests -v
      - name: Run reproducible Round17 physics audit
        run: python scripts/audit_round17.py
      - name: Compare independent reciprocal primitive-cell methods (Round19)
        run: python scripts/audit_round19.py
      - name: Diagnose k-space gap and cancellation (Round20)
        run: python scripts/audit_round20.py
      - name: Verify occupancy sector partition of Kubo response (Round21)
        run: python scripts/audit_occupation_partition.py
      - name: Audit cancellation-conditioned BZ error budget (Round22)
        run: python scripts/audit_round22.py
      - name: Verify equilibrium no-current static Zeeman Ward (Round23)
        run: python scripts/audit_equilibrium_ward.py
      - name: Audit exact Kramers-degenerate equilibrium static Ward (Round24)
        run: python scripts/audit_degenerate_static_ward.py
      - name: Audit covariant k-dependent spin Ward (Round25)
        run: python scripts/audit_covariant_spin_ward.py
      - name: Audit matched Wannier-gauge physical operators (Round26)
        run: python scripts/audit_wannier_operator_contract.py
      - name: Audit longitudinal finite-q charge gauge Ward (Round27)
        run: python scripts/audit_finite_q_gauge_ward.py
      - name: Audit locally conserving charge collision and Zeeman gauge (Round28)
        run: python scripts/audit_conserving_collision.py
      - name: Audit GKSL thermal balance and local bath charge Ward (Round29)
        run: python scripts/audit_thermal_lindblad_ward.py
      - name: Audit interacting fermionic Fock KMS collision and magnetic vertex (Round30)
        run: python scripts/audit_interacting_fock_bath.py
      - name: Audit bosonic bath spectral KMS and finite-z fermionic Ward (Round31)
        run: python scripts/audit_bosonic_davies_dynamic_ward.py
      - name: Audit real-source EPW normalizer and gauge readiness (Round32)
        run: python scripts/audit_epw_material_scattering_contract.py
      - name: Audit native Wannier90 H/r parsing and spin blocking (Round33)
        run: python scripts/audit_native_wannier90_hr_r.py
