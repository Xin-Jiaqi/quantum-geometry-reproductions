name: Cui Flux isolated geometry regression
on:
  push:
    paths:
      - 'papers/cui-2026-curvature-flux-zeeman-qgt/**'
      - '.github/workflows/cui-flux-geometry.yml'
  pull_request:
    paths:
      - 'papers/cui-2026-curvature-flux-zeeman-qgt/**'
      - '.github/workflows/cui-flux-geometry.yml'
jobs:
  nondegenerate-method:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: papers/cui-2026-curvature-flux-zeeman-qgt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install independent geometry kernel
        run: python -m pip install -e .
      - name: Verify restricted published subset
        run: python -m unittest discover -s tests -v
      - name: Run reproducible Round17 physics audit
        run: python scripts/audit_round17.py
      - name: Compare independent reciprocal primitive-cell methods (Round19)
        run: python scripts/audit_round19.py
      - name: Diagnose k-space gap and cancellation (Round20)
        run: python scripts/audit_round20.py
      - name: Verify occupancy sector partition of Kubo response (Round21)
        run: python scripts/audit_occupation_partition.py
      - name: Audit cancellation-conditioned BZ error budget (Round22)
        run: python scripts/audit_round22.py
      - name: Verify equilibrium no-current static Zeeman Ward (Round23)
        run: python scripts/audit_equilibrium_ward.py
      - name: Audit exact Kramers-degenerate equilibrium static Ward (Round24)
        run: python scripts/audit_degenerate_static_ward.py
