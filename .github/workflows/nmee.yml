name: NMEE method reproduction

on:
  push:
    paths:
      - ".github/workflows/nmee.yml"
      - "papers/jia-2026-nonlin-magnetoelectric-edelstein/**"
  pull_request:
    paths:
      - ".github/workflows/nmee.yml"
      - "papers/jia-2026-nonlin-magnetoelectric-edelstein/**"

jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: papers/jia-2026-nonlin-magnetoelectric-edelstein
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Frozen results, repository integrity and numerical regression
        run: python scripts/verify_release.py
