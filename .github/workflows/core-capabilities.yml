name: Reusable physics cores
on:
  push:
    paths:
      - 'papers/**'
      - 'physics/capabilities.json'
      - 'scripts/core.py'
      - 'tests/**'
      - 'requirements-core.txt'
      - '.github/workflows/core-capabilities.yml'
  pull_request:
    paths:
      - 'papers/**'
      - 'physics/capabilities.json'
      - 'scripts/core.py'
      - 'tests/**'
      - 'requirements-core.txt'
      - '.github/workflows/core-capabilities.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
        capability: [nmee, spin, magnetotransport, curvature-flux, igmc]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-core.txt
      - run: python -m pip install -r requirements-core.txt
      - name: Catalog and routing
        run: |
          python scripts/core.py check
          python -m unittest discover -s tests -v
      - name: Paper regression
        run: python scripts/core.py test ${{ matrix.capability }}
      - name: Execute verified model recipe
        run: python scripts/core.py run ${{ matrix.capability }} --output outputs/${{ matrix.capability }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.capability }}-py${{ matrix.python }}
          path: outputs/*.json
