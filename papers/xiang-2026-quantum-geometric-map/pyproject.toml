[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qgmap-xiang-2026"
version = "0.1.0"
description = "Independent protocol-separated quantum-geometric magnetotransport method subset"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]

[tool.setuptools.packages.find]
where = ["src"]
